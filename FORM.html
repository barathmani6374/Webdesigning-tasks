<!DOCTYPE html>
<html>
    <head>
        <title>my forms</title>
    </head>
    <body>
<fieldset>
    <legend>career registration form </legend>
    

        <form action="./nextpage.html">
            <label for="uname">Username</label>
            <input type="text" id="uname" placeholder="Enter your name" name="uname"required>
            <br><br>
    <label for="pass">password</label>
    <input type="password" id="pass" placeholder="Enter your password" name="password">
    <br><br>
    <label for="email">email</label> 
    <input type="email" id="email" placeholder="Enter your email" name="email"  > 
    <br><br>
    <label for="phone">phone</label>
    <input type="tel" id="phone" name="phone">
    <br><br>
    <label for="age">Age</label>
    <input type="number" max="35" min="20" name="age"> 
    <br><br>
    <label for="">gender</label>
    <input type="radio" name="gender">Male
    <input type="radio" name="gender">Female
    <br><br>
    <label for="add">address</label> 
    <textarea name="addr" id="addr" rows="5" cols="30"></textarea>
    <br><br>
    <label for="">Skills</label>
    <input type="checkbox" >Python
    <input type="checkbox" >c++
    <input type="checkbox" >Java
    <input type="checkbox" >Webdesigning
    <br><br>
    <label for="">Location</label>
    <select name="" id="">
        <option value="">salem</option>
        <option value="">combitore</option>
        <option value="">trichy</option>
        <option value="">chennai</option>
    </select>
    <br><br>
    <label for="res">Resume</label>
    <input type="file" id="res" name="Resume">
    <br><br>
    <button type="submit">submit</button>
    <button type="reset">Reset</button>
    


    

        </form>
    </body>
</html>
