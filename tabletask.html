<!DOCTYPE html>
<html>
    <head>
        <title>
            table task
        </title>
    </head>
    <style>
        table,tr,td{
            border: 2px double brown;
            border-collapse: collapse;
        }
    </style>
    <body>
        <table>
            <tr>
                <td>Quick</td>
                <td colspan="2">brown fox</td>
                <td>jumps</td>
            </tr>
            
            <tr>
            <td rowspan="3"> over the</td>
            <td>lazy</td>
            <td>dog</td>
            <td>and</td>

            </tr>

            <tr>
                <!-- <td>over the</td> -->
                <td>then</td>
                <td>it</td>
                <td>fall</td>
            </tr>
            <tr>
                <!-- <td>over the</td> -->
                <td colspan="3">prey to a lion</td>
                
            </tr>
        </table>
    </body>
</html>
