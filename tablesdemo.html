<!DOCTYPE html>
<html>
    <head>
        <title>Table</title>

        <style>
            table,th,tr,td{
                border: 2px solid green;
                border-collapse: collapse;
            }
        </style>
    </head>
    <body>
        <table>
            <!-- rows and columns -->

            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Marks</th>
            </tr>

            <tr>
                <td>Barath</td>
                <td>21</td>
                <td>80</td>
            </tr>

            <tr>
                <td>Sarathy</td>
                <td>22</td>
                <td>80</td>
            </tr>
        </table>

    </body>
</html>
