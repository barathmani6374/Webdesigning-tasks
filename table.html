
<html>

<head>
        
            <title>my table</title>

            <style>
                table,th,td,tr{
                    border:2px solid red;
                    border-collapse: collapse;
                }
            </style>
      
    </head>

    <body>
        <table>
             <tr>
                <th colspan="2"> Name</th>
                <!-- <th>Last Name</th> -->
                <th>Age</th>
                <th>City</th>
            </tr>

            <tr>
                <td>Barath</td>
                <td>M</td>
                <td>21</td>
                <td rowspan="2">Salem</td>
            </tr>

            <!-- rowspan = merging one or more rows
              colspan = merging one or more columns 
            -->
            <tr>
                <td>Raju</td>
                <td>J</td>
                <td>22</td>
                <!-- <td>Salem</td> -->
            </tr>
        </table>
    </body>
</html>
